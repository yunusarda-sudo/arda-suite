name: Full CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Linux audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libportaudio2 portaudio19-dev libsndfile1
      - name: Create isolated test environments
        run: make setup-test-env
      - name: Check shell syntax
        run: make check-shell
      - name: Compile Python packages
        run: |
          apps/jarvis/.venv/bin/python -m compileall -q apps/jarvis/arda
          services/memory/.venv/bin/python -m compileall -q -x '/\.venv/' services/memory
      - name: Verify Python dependencies
        run: |
          apps/jarvis/.venv/bin/python -m pip check
          services/memory/.venv/bin/python -m pip check
      - name: Run full application and memory suites
        run: make test
      - name: Check Shared Memory Pi installer safeguards
        working-directory: services/memory
        run: .venv/bin/python -m unittest test_install_pi
