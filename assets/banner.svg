<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="accentCyan" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="accentPurple" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', Roboto, sans-serif; font-weight: 800; font-size: 54px; letter-spacing: -1.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', Roboto, sans-serif; font-weight: 400; font-size: 19px; letter-spacing: -0.2px; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', Roboto, sans-serif; font-weight: 700; font-size: 17px; fill: #F8FAFC; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', Roboto, sans-serif; font-weight: 400; font-size: 13.5px; fill: #94A3B8; line-height: 1.5; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', Roboto, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.5px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="16" fill="url(#bgGlow)"/>
  <rect width="1200" height="440" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="440" rx="16" fill="url(#accentCyan)"/>
  <rect width="1200" height="440" rx="16" fill="url(#accentPurple)"/>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="438" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Brand Section -->
  <g transform="translate(60, 50)">
    <!-- Logo Icon Box -->
    <rect x="0" y="0" width="68" height="68" rx="18" fill="#1E293B" stroke="url(#cardBorder)" stroke-width="1.5"/>
    <!-- Lightning Bolt Symbol -->
    <path d="M37 14 L20 37 L31 37 L27 54 L48 29 L37 29 Z" fill="url(#logoGrad)"/>

    <!-- Title and Subtitle -->
    <text x="88" y="44" class="title" fill="url(#textGrad)">ARDA SUITE</text>
    
    <!-- Status Badge -->
    <rect x="420" y="20" width="130" height="26" rx="13" fill="#0369A1" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="434" cy="33" r="4" fill="#38BDF8"/>
    <text x="446" y="37" class="badge-text" fill="#38BDF8">LOCAL-FIRST</text>

    <!-- Subtitle -->
    <text x="88" y="74" class="subtitle">Private AI Desktop Assistant · Bounded Execution Engine · Shared Memory Daemon</text>
  </g>

  <!-- 3 Pillars Cards Row -->
  <g transform="translate(60, 175)">
    <!-- Card 1: Jarvis Voice & Desktop -->
    <g transform="translate(0, 0)">
      <rect width="340" height="215" rx="14" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2"/>
      
      <!-- Icon Container -->
      <rect x="22" y="22" width="42" height="42" rx="10" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="33" y="49" font-size="20">🎙️</text>

      <text x="76" y="48" class="card-title">Jarvis Desktop Assistant</text>
      
      <text x="24" y="95" class="card-desc">
        <tspan x="24" dy="0">• Push-to-Talk (⌘⇧A) voice interaction</tspan>
        <tspan x="24" dy="22">• Floating Wispr Flow dictation pill (⌘⇧D)</tspan>
        <tspan x="24" dy="22">• Native macOS actions &amp; Obsidian sync</tspan>
        <tspan x="24" dy="22">• Headless Linux &amp; Raspberry Pi daemon</tspan>
        <tspan x="24" dy="22">• Standalone macOS .app / DMG build</tspan>
      </text>
    </g>

    <!-- Card 2: Bounded Execution & Security -->
    <g transform="translate(370, 0)">
      <rect width="340" height="215" rx="14" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2"/>
      
      <!-- Icon Container -->
      <rect x="22" y="22" width="42" height="42" rx="10" fill="#6366F1" fill-opacity="0.2" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="33" y="49" font-size="20">🛡️</text>

      <text x="76" y="48" class="card-title">Verifiable Bounded Agent</text>
      
      <text x="24" y="95" class="card-desc">
        <tspan x="24" dy="0">• AUTO / CONFIRM / DENY permission gates</tspan>
        <tspan x="24" dy="22">• Human-in-the-loop for high-risk actions</tspan>
        <tspan x="24" dy="22">• Step verification &amp; plan validation</tspan>
        <tspan x="24" dy="22">• Tamper-evident execution audit logs</tspan>
        <tspan x="24" dy="22">• Safe shell execution &amp; path isolation</tspan>
      </text>
    </g>

    <!-- Card 3: Shared Memory & MCP -->
    <g transform="translate(740, 0)">
      <rect width="340" height="215" rx="14" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2"/>
      
      <!-- Icon Container -->
      <rect x="22" y="22" width="42" height="42" rx="10" fill="#9333EA" fill-opacity="0.2" stroke="#C084FC" stroke-width="1" stroke-opacity="0.4"/>
      <text x="33" y="49" font-size="20">🧠</text>

      <text x="76" y="48" class="card-title">Shared Memory Daemon</text>
      
      <text x="24" y="95" class="card-desc">
        <tspan x="24" dy="0">• mem0 + Qdrant local vector storage</tspan>
        <tspan x="24" dy="22">• Standard Model Context Protocol (MCP)</tspan>
        <tspan x="24" dy="22">• Local Ollama embeddings &amp; extraction</tspan>
        <tspan x="24" dy="22">• Real-time web monitoring dashboard</tspan>
        <tspan x="24" dy="22">• Offline retrieval comparison harness</tspan>
      </text>
    </g>
  </g>
</svg>
